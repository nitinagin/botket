name: Robot City Phase 1 tests

on:
  push:
    branches: [main]
    paths:
      - robot-city.html
      - world.html
      - tests/world-entry.test.mjs
      - tests/robot-city-smoke.test.mjs
      - tests/robot-city-browser.test.mjs
      - .github/workflows/robot-city-tests.yml
  pull_request:
    paths:
      - robot-city.html
      - world.html
      - tests/world-entry.test.mjs
      - tests/robot-city-smoke.test.mjs
      - tests/robot-city-browser.test.mjs
      - .github/workflows/robot-city-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robot-city-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run Robot City smoke tests
        run: node --test tests/robot-city-smoke.test.mjs
      - name: Check BOTKET World preview entry
        run: node --test tests/world-entry.test.mjs
      - name: Verify Chrome is installed
        run: command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Run Robot City browser controls test
        run: node --test tests/robot-city-browser.test.mjs
